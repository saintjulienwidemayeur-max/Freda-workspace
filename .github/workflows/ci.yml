name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Le CSS Tailwind, le bundle d'icônes, les pages d'atterrissage SEO, sitemap.xml et llms*.txt sont générés et versionnés : ils doivent être à jour.
      - name: Vérifier que les fichiers générés sont à jour
        run: |
          npm run build
          git diff --exit-code
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }

      - run: npx playwright install --with-deps chromium
      - run: npm test
