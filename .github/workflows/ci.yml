name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Le CSS Tailwind et le bundle d'icônes sont versionnés : ils doivent être à jour.
      - name: Vérifier que les fichiers générés sont à jour
        run: |
          npm run build
          git diff --exit-code -- assets/css/tailwind.css assets/js/icons.js

      - run: npx playwright install --with-deps chromium
      - run: npm test
