services:
  - type: web
    name: freda-workspace
    runtime: static
    buildCommand: echo ok
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://plausible.io; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://plausible.io https://api.fredaworkspace.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/img/*
        name: Cache-Control
        value: public, max-age=2592000
      - path: /assets/css/*
        name: Cache-Control
        value: public, max-age=3600
      - path: /assets/js/*
        name: Cache-Control
        value: public, max-age=3600

  # API (recherche et achat de domaines via NameSilo). Les clés se saisissent dans le tableau de bord Render.
  - type: web
    name: freda-workspace-api
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NAMESILO_ENV
        value: sandbox          # passer à production seulement quand Freda Pay est branché
      - key: NAMESILO_API_KEY
        sync: false
      - key: NAMESILO_CONTACT_ID
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PAYMENTS_PROVIDER
        value: demo             # interdit avec NAMESILO_ENV=production
      - key: ALLOWED_ORIGINS
        value: https://fredaworkspace.com
      - key: DATA_FILE
        value: /var/data/store.json
    disk:
      name: api-data
      mountPath: /var/data
      sizeGB: 1
