services:
  - type: web
    name: freda-workspace
    runtime: static
    buildCommand: node scripts/build-config.js     # écrit DEMO_MODE / API_BASE depuis FW_DEMO_MODE / FW_API_BASE ci-dessous (sans elles : le site reste en démo)
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: FW_DEMO_MODE
        value: "false"
      - key: FW_API_BASE
        value: https://freda-workspace-api.onrender.com/api     # remplacer par https://api.fredaworkspace.com/api une fois le domaine associé
    staticPublishPath: .
    # www -> apex : pas de règle `routes` ici. Un `type: redirect` de render.yaml ne porte que sur les chemins, pas sur le nom d'hôte, et
    # une règle sur « / » ferait une boucle de redirection. Render redirige déjà automatiquement www.fredaworkspace.com vers
    # fredaworkspace.com quand les DEUX domaines sont ajoutés au service (Dashboard > Settings > Custom Domains) ; il suffit donc d'ajouter
    # les deux et de vérifier que le DNS de www pointe vers le service. Le canonical des pages (https://fredaworkspace.com/…) reste la référence.
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://plausible.io https://js.stripe.com https://*.js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.stripe.com; font-src 'self'; connect-src 'self' https://plausible.io https://api.fredaworkspace.com https://freda-workspace-api.onrender.com https://api.stripe.com https://checkout.stripe.com; frame-src https://js.stripe.com https://*.js.stripe.com https://hooks.stripe.com https://checkout.stripe.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/img/*
        name: Cache-Control
        value: public, max-age=2592000
      - path: /assets/css/*
        name: Cache-Control
        value: public, max-age=3600
      - path: /assets/js/*
        name: Cache-Control
        value: public, max-age=3600
      # Fichiers racine (icônes, image de partage) : 30 jours ; fichiers lus par les robots (robots.txt, sitemap, llms) : 1 heure.
      # Les pages HTML gardent le défaut de Render (public, max-age=0, must-revalidate) pour que chaque déploiement soit visible tout de suite.
      - path: /*.png
        name: Cache-Control
        value: public, max-age=2592000
      - path: /*.ico
        name: Cache-Control
        value: public, max-age=2592000
      - path: /*.svg
        name: Cache-Control
        value: public, max-age=2592000
      - path: /*.txt
        name: Cache-Control
        value: public, max-age=3600
      - path: /*.xml
        name: Cache-Control
        value: public, max-age=3600
