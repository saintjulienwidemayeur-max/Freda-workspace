<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 120 120" width="96" height="96" role="img" aria-label="Chargement">
<defs>
<linearGradient id="g" gradientUnits="userSpaceOnUse" x1="14" y1="14" x2="86" y2="86"><stop offset="0" stop-color="#2F9BFF"/><stop offset="1" stop-color="#3B6FF5"/></linearGradient>
</defs>
<style>
.r{fill:none;stroke:url(#g);stroke-width:9;stroke-linecap:round;animation-duration:3.2s;animation-iteration-count:infinite}
.a{animation-name:a}.b{animation-name:b}
.p{fill:#2F9BFF;opacity:0;animation:p 3.2s infinite;animation-delay:var(--d)}
@keyframes a{0%{stroke-dasharray:100.00 0.00;stroke-dashoffset:50.00;opacity:1;animation-timing-function:linear}12%{stroke-dasharray:100.00 0.00;stroke-dashoffset:50.00;opacity:1;animation-timing-function:cubic-bezier(.65,0,.35,1)}38%{stroke-dasharray:1.20 98.80;stroke-dashoffset:0.60;opacity:1;animation-timing-function:linear}41%{stroke-dasharray:0.01 99.99;stroke-dashoffset:0.01;opacity:0;animation-timing-function:linear}100%{stroke-dasharray:0.01 99.99;stroke-dashoffset:0.01;opacity:0;animation-timing-function:linear}}
@keyframes b{0%{stroke-dasharray:0.01 99.99;stroke-dashoffset:-49.99;opacity:0;animation-timing-function:linear}45%{stroke-dasharray:0.01 99.99;stroke-dashoffset:-49.99;opacity:0;animation-timing-function:linear}46%{stroke-dasharray:1.20 98.80;stroke-dashoffset:-49.40;opacity:1;animation-timing-function:cubic-bezier(.2,.7,.3,1)}80%{stroke-dasharray:92.00 8.00;stroke-dashoffset:-4.00;opacity:1;animation-timing-function:cubic-bezier(.2,.7,.3,1)}90%{stroke-dasharray:100.00 0.00;stroke-dashoffset:0.00;opacity:1;animation-timing-function:linear}100%{stroke-dasharray:100.00 0.00;stroke-dashoffset:0.00;opacity:1;animation-timing-function:linear}}
@keyframes p{0%,58%{opacity:0;transform:translate(0,0) scale(1)}62%{opacity:1}90%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4)}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.r,.p{animation:none}.a{stroke-dasharray:100 0;opacity:1}.b,.p{opacity:0}}
</style>
<g transform="rotate(-90 50 50)">
<circle class="r a" cx="50" cy="50" r="40" pathLength="100"/>
<circle class="r b" cx="50" cy="50" r="40" pathLength="100"/>
</g>
