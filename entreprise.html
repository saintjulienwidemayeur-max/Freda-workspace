<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Votre entreprise · Freda Workspace</title>
  <meta name="description" content="Étape facultative : renseignez les informations de votre entreprise pour vos factures.">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#2B64E4">
  <link rel="preload" href="assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/tailwind.css">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-base="">
  <div id="page-loader" role="status" aria-live="polite"><img class="fw-ring" src="assets/img/loader.svg" alt="" width="72" height="72"><span class="sr-only">Chargement…</span></div>
  <div class="min-h-screen">
    <main class="flex flex-col min-h-screen gutter max-w-site mx-auto">
      <div class="flex items-center justify-between h-16 lg:h-20">
        <a href="index.html"><img src="assets/img/logo-horizontal.svg" alt="Freda Workspace" class="h-10 w-auto"></a>
        <a href="#" id="skip-top" class="text-sm font-semibold text-muted hover:text-ink">Passer cette étape</a>
      </div>

      <div class="flex-1 flex items-center justify-center py-10">
        <div class="w-full max-w-[520px]">
          <ol class="flex items-center gap-2 text-xs font-semibold text-muted" aria-label="Progression">
            <li class="flex items-center gap-1.5"><span class="w-5 h-5 rounded-full bg-cta text-white grid place-items-center"><i data-lucide="check" class="w-3 h-3"></i></span>Compte</li>
            <li class="h-px w-6 bg-line"></li>
            <li class="flex items-center gap-1.5 text-ink"><span class="w-5 h-5 rounded-full bg-freda text-white grid place-items-center text-[11px]">2</span>Entreprise <span class="font-normal text-muted">(facultatif)</span></li>
            <li class="h-px w-6 bg-line"></li>
            <li class="flex items-center gap-1.5"><span class="w-5 h-5 rounded-full border border-line grid place-items-center text-[11px]">3</span>Domaine</li>
          </ol>

          <h1 class="mt-6 text-3xl font-extrabold tracking-tight">Configurez votre entreprise</h1>
          <p class="mt-2 text-slate-600">Ces informations apparaissent sur vos factures. Vous pouvez passer cette étape et les compléter plus tard dans <strong>Paramètres</strong>.</p>

          <form id="company-form" class="mt-7 grid sm:grid-cols-2 gap-4" novalidate>
            <div class="sm:col-span-2">
              <label for="co-name" class="label">Raison sociale</label>
              <input id="co-name" class="input" autocomplete="organization" placeholder="Mon Entreprise">
            </div>
            <div>
              <label for="co-nif" class="label">Numéro fiscal <span class="font-normal text-muted">(NIF)</span></label>
              <input id="co-nif" class="input mono" autocomplete="off" placeholder="000-000-000-0">
            </div>
            <div>
              <label for="co-billing" class="label">Email de facturation</label>
              <input id="co-billing" type="email" class="input" autocomplete="email" placeholder="compta@monentreprise.com">
              <p class="field-error" data-for="co-billing">Entrez une adresse email valide.</p>
            </div>
            <div class="sm:col-span-2">
              <label for="co-address" class="label">Adresse</label>
              <input id="co-address" class="input" autocomplete="street-address" placeholder="Rue, numéro">
            </div>
            <div>
              <label for="co-city" class="label">Ville</label>
              <input id="co-city" class="input" autocomplete="address-level2">
            </div>
            <div>
              <label for="co-country" class="label">Pays</label>
              <select id="co-country" class="select input" autocomplete="country-name"></select>
            </div>
            <p class="field-error sm:col-span-2 p-3 rounded-lg bg-red-50" id="company-error" role="alert"></p>
            <div class="sm:col-span-2 mt-2 flex flex-col-reverse sm:flex-row gap-3 sm:justify-between">
              <button type="button" class="btn btn-ghost btn-lg" id="skip-bottom">Passer cette étape</button>
              <button type="submit" class="btn btn-cta btn-lg">Enregistrer et continuer<i data-lucide="arrow-right"></i></button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="assets/js/icons.js" defer></script>
  <script src="assets/js/config.js" defer></script>
  <script src="assets/js/monitor.js" defer></script>
  <script src="assets/js/api.js" defer></script>
  <script src="assets/js/ui.js" defer></script>
  <script src="assets/js/pages/entreprise.js" defer></script>
</body>
</html>
